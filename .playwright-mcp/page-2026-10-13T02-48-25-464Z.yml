      - generic [ref=f3e98]: 1934 年 10 月，因第五次反 “围剿” 失利，8 万多中央红军从江西瑞金出发，开启战略转移，最初计划前往湘西会合红二、红六军团。 红军接连突破三道封锁线，血战湘江后兵力锐减，放弃原定计划，转向国民党兵力薄弱的贵州。1935 年 1 月渡过乌江、攻占遵义，召开遵义会议，实现伟大历史转折。 会后红军上演经典的四渡赤水，在川黔滇交界灵活穿插调动敌军，佯攻贵阳、威逼昆明，1935 年 5 月巧渡金沙江，跳出敌人包围圈；随后强渡大渡河、飞夺泸定桥。 接着红军翻越夹金山等雪山，跋涉危机四伏的茫茫草地，攻克腊子口，翻越六盘山，1935 年 10 月中央红军抵达陕北吴起镇。 1936 年 10 月，红二、红四方面军在甘肃会宁、将台堡同红一方面军胜利会师，长征胜利结束。 两万五千里长征跨越多重复杂地形，是山河间的伟大行军，深刻改变了中国历史走向。
